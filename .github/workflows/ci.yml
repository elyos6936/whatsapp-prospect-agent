name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:guards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
