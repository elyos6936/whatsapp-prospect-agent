name: Health probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Preflight diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || 'https://api.klanvio.com' }}
        run: npx tsx scripts/preflight-diagnostic.ts --json
        continue-on-error: false
